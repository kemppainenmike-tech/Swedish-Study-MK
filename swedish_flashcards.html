<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Svenska Fraser — Swedish Phrase Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1220;
  --bg2: #101828;
  --surface: #1a2540;
  --surface2: #1e2e50;
  --border: #2a3d6a;
  --text: #e8edf8;
  --text-dim: #8a9bbf;
  --text-muted: #4a5a80;
  --accent: #5d9bd4;
  --accent2: #3a7bbf;
  --easy: #4caf7d;
  --medium: #e8a838;
  --hard: #e05252;
  --easy-bg: rgba(76,175,125,0.12);
  --medium-bg: rgba(232,168,56,0.12);
  --hard-bg: rgba(224,82,82,0.12);
  --card-shadow: 0 8px 32px rgba(0,0,0,0.5);
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Crimson Pro', Georgia, serif;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(93,155,212,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(58,123,191,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}
#app {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 600px;
  margin: 0 auto;
  padding: 0 16px;
}
.header {
  padding: 20px 0 12px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-shrink: 0;
}
.header h1 {
  font-size: 1.15rem;
  font-weight: 300;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.header .flag { font-size: 1.4rem; }
.btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.reset-btn {
  color: var(--text-muted);
}
.reset-btn:hover {
  color: var(--hard);
  border-color: rgba(224,82,82,0.4);
  background: rgba(224,82,82,0.08);
}
.export-btn {
  color: var(--accent);
  border-color: rgba(93,155,212,0.4);
}
.export-btn:hover {
  color: var(--bg);
  background: var(--accent);
  border-color: var(--accent);
}
.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,16,32,0.9);
  backdrop-filter: blur(8px);
  z-index: 200;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  padding: 24px;
  text-align: center;
}
.confirm-overlay.active { display: flex; }
.confirm-overlay h3 { font-size: 1.4rem; font-weight: 300; color: var(--text); }
.confirm-overlay p {
  color: var(--text-muted);
  font-size: 0.9rem;
  font-family: 'DM Mono', monospace;
  max-width: 300px;
  line-height: 1.6;
}
.confirm-buttons { display: flex; gap: 12px; }
.confirm-yes {
  padding: 12px 28px;
  background: var(--hard);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: 'Crimson Pro', serif;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s;
}
.confirm-yes:hover { filter: brightness(1.15); }
.confirm-no {
  padding: 12px 28px;
  background: var(--surface);
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'Crimson Pro', serif;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s;
}
.confirm-no:hover { background: var(--surface2); }
.progress-wrap { flex-shrink: 0; margin-bottom: 12px; }
.progress-info {
  display: flex;
  justify-content: space-between;
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}
.round-badge {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 20px;
  color: var(--accent);
  font-size: 0.65rem;
}
.progress-bar { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  border-radius: 2px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.card-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8px 0;
  min-height: 0;
}
.flashcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 36px;
  box-shadow: var(--card-shadow);
  text-align: center;
  cursor: pointer;
  user-select: none;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  min-height: 240px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 20px;
}
.flashcard::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.5;
}
.flashcard:active { transform: scale(0.985); box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
.word-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.swedish-phrase {
  font-size: clamp(1.4rem, 4.5vw, 2.1rem);
  font-weight: 400;
  color: var(--text);
  line-height: 1.35;
  letter-spacing: -0.01em;
}
.english-phrase {
  font-size: clamp(1rem, 3vw, 1.4rem);
  font-weight: 300;
  font-style: italic;
  color: var(--accent);
  line-height: 1.4;
  max-width: 90%;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.english-phrase.revealed { opacity: 1; transform: translateY(0); }
.tap-hint {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  position: absolute;
  bottom: 16px;
  right: 20px;
}
.rating-section {
  margin-top: 16px;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.3s ease 0.1s, transform 0.3s ease 0.1s;
  pointer-events: none;
  flex-shrink: 0;
}
.rating-section.visible { opacity: 1; transform: translateY(0); pointer-events: all; }
.rating-label {
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.rating-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.rating-btn {
  padding: 14px 8px;
  border: 1px solid;
  border-radius: 10px;
  background: transparent;
  font-family: 'Crimson Pro', serif;
  font-size: 1rem;
  font-weight: 400;
  cursor: pointer;
  transition: all 0.18s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.rating-btn .btn-icon { font-size: 1.2rem; }
.rating-btn.easy { color: var(--easy); border-color: rgba(76,175,125,0.3); background: var(--easy-bg); }
.rating-btn.medium { color: var(--medium); border-color: rgba(232,168,56,0.3); background: var(--medium-bg); }
.rating-btn.hard { color: var(--hard); border-color: rgba(224,82,82,0.3); background: var(--hard-bg); }
.rating-btn:hover { transform: translateY(-2px); filter: brightness(1.15); }
.rating-btn:active { transform: translateY(0) scale(0.96); }
.stats-strip {
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 10px 0 20px;
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.08em;
}
.stat { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
.stat-dot { width: 7px; height: 7px; border-radius: 50%; }
.stat.easy .stat-dot { background: var(--easy); }
.stat.medium .stat-dot { background: var(--medium); }
.stat.hard .stat-dot { background: var(--hard); }
.round-complete {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,16,32,0.92);
  backdrop-filter: blur(12px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 24px;
  text-align: center;
  gap: 24px;
}
.round-complete.active { display: flex; }
.round-complete h2 { font-size: 2rem; font-weight: 300; color: var(--accent); letter-spacing: -0.01em; }
.round-complete p { color: var(--text-dim); font-size: 1.1rem; font-weight: 300; max-width: 340px; line-height: 1.6; }
.round-summary { display: flex; gap: 20px; justify-content: center; font-family: 'DM Mono', monospace; font-size: 0.75rem; }
.sum-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
}
.sum-num { font-size: 1.5rem; color: var(--text); font-family: 'Crimson Pro', serif; }
.sum-num.easy { color: var(--easy); }
.sum-num.medium { color: var(--medium); }
.sum-num.hard { color: var(--hard); }
.sum-label { color: var(--text-muted); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; }
.continue-btn {
  padding: 16px 40px;
  background: var(--accent2);
  color: white;
  border: none;
  border-radius: 10px;
  font-family: 'Crimson Pro', serif;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: all 0.2s ease;
  margin-top: 8px;
}
.continue-btn:hover { background: var(--accent); transform: translateY(-2px); }
.score-pills {
  display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; flex-shrink: 0;
}
.score-pill {
  display: flex; align-items: center; gap: 6px; padding: 6px 14px;
  border-radius: 20px; border: 1px solid;
  font-family: 'DM Mono', monospace; font-size: 0.72rem; letter-spacing: 0.06em;
  transition: all 0.25s ease;
}
.score-pill.easy { color: var(--easy); border-color: rgba(76,175,125,0.35); background: var(--easy-bg); }
.score-pill.medium { color: var(--medium); border-color: rgba(232,168,56,0.35); background: var(--medium-bg); }
.score-pill.hard { color: var(--hard); border-color: rgba(224,82,82,0.35); background: var(--hard-bg); }
.score-pill .pill-num { font-size: 1rem; font-family: 'Crimson Pro', serif; font-weight: 600; min-width: 1.2ch; text-align: right; }
.score-pill.bumped { transform: scale(1.12); transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes cardSlideIn {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}
.flashcard.animating { animation: cardSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
@media (max-height: 700px) {
  .flashcard { min-height: 180px; padding: 28px 28px; }
  .header { padding: 14px 0 8px; }
  .stats-strip { padding: 8px 0 14px; }
  .score-pills { margin-bottom: 8px; }
}
@media (max-width: 400px) {
  .rating-btn { padding: 12px 4px; font-size: 0.9rem; }
  .flashcard { padding: 32px 24px; }
  .score-pill { padding: 5px 10px; font-size: 0.66rem; }
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Svenska Fraser</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="sync-status" style="font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--text-muted);letter-spacing:0.06em;"></span>
      <button class="btn export-btn" onclick="exportRatings()">Export</button>
      <button class="btn reset-btn" onclick="confirmReset()">Reset</button>
      <span class="flag">🇸🇪</span>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="progress-text">0 / 0</span>
      <span class="round-badge" id="round-badge">Round 1</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="score-pills">
    <div class="score-pill easy" id="pill-easy"><span class="pill-num" id="pill-easy-num">0</span><span>Easy</span></div>
    <div class="score-pill medium" id="pill-medium"><span class="pill-num" id="pill-medium-num">0</span><span>Medium</span></div>
    <div class="score-pill hard" id="pill-hard"><span class="pill-num" id="pill-hard-num">0</span><span>Hard</span></div>
  </div>

  <div class="card-area">
    <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Tap to reveal English translation">
      <span class="word-label">Svenska</span>
      <div class="swedish-phrase" id="swedish-phrase">—</div>
      <div class="english-phrase" id="english-phrase"></div>
      <span class="tap-hint" id="tap-hint">tap to reveal</span>
    </div>
  </div>

  <div class="rating-section" id="rating-section">
    <div class="rating-label">How well did you know this?</div>
    <div class="rating-buttons">
      <button class="rating-btn easy" onclick="rate('easy')"><span class="btn-icon">😊</span><span>Easy</span></button>
      <button class="rating-btn medium" onclick="rate('medium')"><span class="btn-icon">🤔</span><span>Medium</span></button>
      <button class="rating-btn hard" onclick="rate('hard')"><span class="btn-icon">😤</span><span>Hard</span></button>
    </div>
  </div>

  <div class="stats-strip">
    <div class="stat easy"><div class="stat-dot"></div><span id="easy-count">0 easy</span></div>
    <div class="stat medium"><div class="stat-dot"></div><span id="medium-count">0 medium</span></div>
    <div class="stat hard"><div class="stat-dot"></div><span id="hard-count">0 hard</span></div>
  </div>
</div>

<div class="confirm-overlay" id="confirm-overlay">
  <h3>Reset all progress?</h3>
  <p>This will clear your phrase ratings and start from Round 1.</p>
  <div class="confirm-buttons">
    <button class="confirm-no" onclick="cancelReset()">Cancel</button>
    <button class="confirm-yes" onclick="doReset()">Reset</button>
  </div>
</div>

<div class="round-complete" id="round-complete">
  <h2 id="rc-title">Round Complete!</h2>
  <p id="rc-desc"></p>
  <div class="round-summary">
    <div class="sum-item"><span class="sum-num easy" id="rc-easy">0</span><span class="sum-label">Easy</span></div>
    <div class="sum-item"><span class="sum-num medium" id="rc-medium">0</span><span class="sum-label">Medium</span></div>
    <div class="sum-item"><span class="sum-num hard" id="rc-hard">0</span><span class="sum-label">Hard</span></div>
  </div>
  <button class="continue-btn" id="continue-btn" onclick="startNextRound()">Continue →</button>
</div>

<script>

const STORAGE_KEY = 'svenska_fraser_v1';
let round = 1, queue = [], currentIdx = 0, currentWord = null, revealed = false;
let ratings = { easy: 0, medium: 0, hard: 0 };
let wordRatings = {};

function lsSave(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch(e) {} }
function lsLoad() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
function lsClear() { try { localStorage.removeItem(STORAGE_KEY); } catch(e) {} }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildRound1Queue() {
  return shuffle(ALL_PHRASES.map((w, i) => ({ ...w, origIdx: i })));
}

function buildRound2PlusQueue() {
  const arr = [];
  ALL_PHRASES.forEach((w, i) => {
    const r = wordRatings[i];
    arr.push({ ...w, origIdx: i });
    if (r === 'hard') arr.push({ ...w, origIdx: i }); // hard appears twice
  });
  return shuffle(arr);
}

function saveState() {
  lsSave({ round, currentIdx, ratings, wordRatings, queueIdxs: queue.map(w => w.origIdx) });
}

function loadState() {
  const d = lsLoad();
  if (!d) return false;
  round = d.round || 1;
  currentIdx = d.currentIdx || 0;
  ratings = d.ratings || { easy: 0, medium: 0, hard: 0 };
  wordRatings = d.wordRatings || {};
  queue = (d.queueIdxs || []).map(idx => {
    const w = ALL_PHRASES[idx];
    return w ? { ...w, origIdx: idx } : null;
  }).filter(Boolean);
  return queue.length > 0;
}

function startNextRound() {
  document.getElementById('round-complete').classList.remove('active');
  round++;
  queue = buildRound2PlusQueue();
  currentIdx = 0;
  ratings = { easy: 0, medium: 0, hard: 0 };
  updateStats();
  saveState();
  showCard();
}

function showCard() {
  if (currentIdx >= queue.length) { showRoundComplete(); return; }
  currentWord = queue[currentIdx];
  revealed = false;
  const card = document.getElementById('flashcard');
  card.classList.remove('animating');
  void card.offsetWidth;
  card.classList.add('animating');
  document.getElementById('swedish-phrase').textContent = currentWord.sv;
  const enEl = document.getElementById('english-phrase');
  enEl.textContent = currentWord.en;
  enEl.classList.remove('revealed');
  document.getElementById('tap-hint').style.display = '';
  document.getElementById('rating-section').classList.remove('visible');
  updateProgress();
}

function revealCard() {
  if (revealed) return;
  revealed = true;
  document.getElementById('english-phrase').classList.add('revealed');
  document.getElementById('tap-hint').style.display = 'none';
  document.getElementById('rating-section').classList.add('visible');
}

function rate(difficulty) {
  if (!revealed) return;
  if (currentWord !== null) wordRatings[currentWord.origIdx] = difficulty;
  ratings[difficulty]++;
  updateStats(difficulty);
  currentIdx++;
  saveState();
  showCard();
}

function updateProgress() {
  const total = queue.length, done = currentIdx;
  document.getElementById('progress-text').textContent = done + ' / ' + total;
  document.getElementById('progress-fill').style.width = (total > 0 ? (done / total) * 100 : 0) + '%';
  document.getElementById('round-badge').textContent = 'Round ' + round;
}

function updateStats(bumped) {
  document.getElementById('easy-count').textContent = ratings.easy + ' easy';
  document.getElementById('medium-count').textContent = ratings.medium + ' medium';
  document.getElementById('hard-count').textContent = ratings.hard + ' hard';
  document.getElementById('pill-easy-num').textContent = ratings.easy;
  document.getElementById('pill-medium-num').textContent = ratings.medium;
  document.getElementById('pill-hard-num').textContent = ratings.hard;
  if (bumped) {
    const pill = document.getElementById('pill-' + bumped);
    pill.classList.remove('bumped');
    void pill.offsetWidth;
    pill.classList.add('bumped');
    setTimeout(() => pill.classList.remove('bumped'), 300);
  }
}

function showRoundComplete() {
  document.getElementById('rc-easy').textContent = ratings.easy;
  document.getElementById('rc-medium').textContent = ratings.medium;
  document.getElementById('rc-hard').textContent = ratings.hard;
  const hardCount = Object.values(wordRatings).filter(r => r === 'hard').length;
  if (round === 1) {
    document.getElementById('rc-title').textContent = 'Round 1 Complete!';
    document.getElementById('rc-desc').textContent = 'You went through all ' + (ratings.easy+ratings.medium+ratings.hard).toLocaleString() + ' phrases. Next round: hard phrases appear twice for extra practice.';
    document.getElementById('continue-btn').textContent = 'Start Round 2 →';
  } else {
    document.getElementById('rc-title').textContent = 'Round ' + round + ' Complete!';
    document.getElementById('rc-desc').textContent = 'Great work! You still have ' + hardCount.toLocaleString() + ' hard phrase' + (hardCount !== 1 ? 's' : '') + ' to master.';
    document.getElementById('continue-btn').textContent = 'Start Round ' + (round+1) + ' →';
  }
  document.getElementById('round-complete').classList.add('active');
}

function exportRatings() {
  let r = wordRatings;
  if (!r || Object.keys(r).length === 0) {
    const saved = lsLoad();
    if (saved && saved.wordRatings) r = saved.wordRatings;
  }
  const easy = [], medium = [], hard = [], unrated = [];
  ALL_PHRASES.forEach((p, i) => {
    const rating = r[i];
    if (rating === 'easy') easy.push(p);
    else if (rating === 'medium') medium.push(p);
    else if (rating === 'hard') hard.push(p);
    else unrated.push(p);
  });
  if (easy.length + medium.length + hard.length === 0) {
    alert('No ratings yet! Study some phrases first, then export.');
    return;
  }
  const rows = [['Rating','Swedish','English']];
  easy.forEach(p => rows.push(['Easy', p.sv, p.en]));
  medium.forEach(p => rows.push(['Medium', p.sv, p.en]));
  hard.forEach(p => rows.push(['Hard', p.sv, p.en]));
  unrated.forEach(p => rows.push(['Unrated', p.sv, p.en]));
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'swedish_phrase_ratings.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function confirmReset() { document.getElementById('confirm-overlay').classList.add('active'); }
function cancelReset() { document.getElementById('confirm-overlay').classList.remove('active'); }
function doReset() {
  lsClear();
  round = 1; currentIdx = 0;
  ratings = { easy: 0, medium: 0, hard: 0 };
  wordRatings = {};
  queue = buildRound1Queue();
  document.getElementById('confirm-overlay').classList.remove('active');
  updateStats();
  showCard();
}

document.getElementById('flashcard').addEventListener('click', revealCard);
document.getElementById('flashcard').addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealCard(); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('.rating-buttons') || e.target.closest('.continue-btn')) return;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); revealCard(); }
  if (revealed) {
    if (e.key === '1') rate('easy');
    if (e.key === '2') rate('medium');
    if (e.key === '3') rate('hard');
  }
});

function init() {
  if (!loadState()) {
    queue = buildRound1Queue();
    currentIdx = 0;
  }
  updateStats();
  showCard();
}
init();
</script>
